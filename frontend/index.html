<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎮 GameTrack</h1>
        <p>Keep track of your gaming progress.</p>
    </header>

    <main>

        <!-- Statistics -->
        <section class="stats-section">

            <div class="stat-card">
                <h3 id="total-games">0</h3>
                <p>Total Games</p>
            </div>

            <div class="stat-card">
                <h3 id="playing-games">0</h3>
                <p>Playing</p>
            </div>

            <div class="stat-card">
                <h3 id="completed-games">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h3 id="average-progress">0%</h3>
                <p>Average Progress</p>
            </div>

        </section>


        <!-- Add / Edit Game Form -->
        <section class="form-section">

            <h2 id="form-title">Add a Game</h2>

            <form id="game-form">

                <input
                    type="text"
                    id="title"
                    placeholder="Game title"
                    required
                >

                <input
                    type="text"
                    id="platform"
                    placeholder="Platform (PC, PS5, Xbox...)"
                    required
                >

                <input
                    type="number"
                    id="progress"
                    placeholder="Progress (%)"
                    min="0"
                    max="100"
                    required
                >

                <select id="status" required>

                    <option value="">Select status</option>

                    <option value="Playing">
                        Playing
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Paused">
                        Paused
                    </option>

                    <option value="Wishlist">
                        Wishlist
                    </option>

                </select>

                <textarea
                    id="notes"
                    placeholder="Notes"
                    rows="4"
                ></textarea>

                <button
                    type="submit"
                    id="submit-button"
                >
                    Add Game
                </button>

                <button
                    type="button"
                    id="cancel-button"
                    class="hidden"
                >
                    Cancel Edit
                </button>

            </form>

        </section>


        <!-- Status messages -->

        <p id="loading" class="hidden">
            Loading games...
        </p>

        <p id="error" class="error hidden"></p>


        <!-- Games -->

        <section class="games-section">

            <h2>My Games</h2>


            <!-- Search and Filters -->

            <div class="filters">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search games..."
                >

                <select id="status-filter">

                    <option value="all">
                        All Status
                    </option>

                    <option value="Playing">
                        Playing
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Paused">
                        Paused
                    </option>

                    <option value="Wishlist">
                        Wishlist
                    </option>

                </select>


                <select id="platform-filter">

                    <option value="all">
                        All Platforms
                    </option>

                </select>

            </div>


            <!-- Games will be inserted here -->

            <div id="games-list"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
